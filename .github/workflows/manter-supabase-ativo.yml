# Mantém o projeto do Supabase acordado.
# No plano grátis, o Supabase pausa o projeto depois de 7 dias sem uso.
# Este robô do GitHub faz uma leitura pequena no banco a cada 3 dias (de graça).
#
# Precisa de dois "secrets" no GitHub (Settings > Secrets and variables > Actions):
#   SUPABASE_URL              ex.: https://xxxx.supabase.co
#   SUPABASE_PUBLISHABLE_KEY  a mesma chave sb_publishable_... do .env.local (é pública, não é a service_role)
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 12 */3 * *" # a cada 3 dias, 9h17 em Brasília
  workflow_dispatch: # botão "Run workflow" para testar na hora

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ler uma barbearia (consulta pública, só leitura)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Faltam os secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY no GitHub."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" --retry 3 --retry-delay 20 \
            "${SUPABASE_URL%/}/rest/v1/barbearias?select=id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase respondeu: $status"
          [ "$status" = "200" ] || { echo "::error::Resposta inesperada do Supabase ($status). O projeto pode estar pausado."; exit 1; }
